<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam & Score Analytics</title>
    <style>
        :root {
            --bg-main: #f4f7fe;
            --text-main: #2b3674;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .records-section {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
            width: 100%;
            max-width: 960px;
        }

        .records-section h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            opacity: 0.95;
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 藍色漸層按鈕 */
        .btn-blue-grad {
            background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
        }

        /* 綠色漸層按鈕 */
        .btn-emerald-grad {
            background: linear-gradient(135deg, #05CD99 0%, #10B981 100%);
        }

        #records-list {
            background-color: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 14px;
            padding: 24px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a3edd3;
            color: #a3b2c7;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Admin View Records -->
    <div class="records-section">
        <h3 style="color: var(--text-main); font-size: 1.15rem; margin-top: 4px;">📊 Student Exam & Score Analytics</h3>

        <div class="admin-btn-grid">
            <!-- Row 1: Bright Royal Blue Gradient -->
            <button class="btn btn-blue-grad admin-action-btn" onclick="loadAdminStudentRecords()">📅 Daily Records (<span id="records-date-label"></span>)</button>
            <button class="btn btn-blue-grad admin-action-btn" onclick="calculateWeeklyLeaderboard()">🏆 Weekly Ranking</button>
            <button class="btn btn-blue-grad admin-action-btn" onclick="openCustomRangeModal()">🗓️ Custom Ranking</button>
            
            <!-- Row 2: Bright Emerald Green Gradient -->
            <button class="btn btn-emerald-grad admin-action-btn" onclick="calculateUncorrectedStudents()">❌ Correction List</button>
            <button class="btn btn-emerald-grad admin-action-btn" onclick="calculateAbsentStudents()">🚫 Absent List</button>
        </div>

        <div id="records-list">
            點擊上方按鈕以載入分析資料
        </div>
    </div>

    <script>
        // 初始化日期標籤
        document.addEventListener('DOMContentLoaded', () => {
            const dateLabel = document.getElementById('records-date-label');
            if (dateLabel) {
                const today = new Date().toISOString().split('T')[0];
                dateLabel.textContent = today;
            }
        });

        // 按鈕對應事件函數處理
        function loadAdminStudentRecords() {
            document.getElementById('records-list').innerHTML = '<p>📅 成功載入今日學生考試紀錄。</p>';
        }

        function calculateWeeklyLeaderboard() {
            document.getElementById('records-list').innerHTML = '<p>🏆 成功載入本週排行榜 (Weekly Ranking)。</p>';
        }

        function openCustomRangeModal() {
            alert('🗓️ 開啟自訂範圍排行榜 (Custom Ranking) 設定彈窗');
        }

        function calculateUncorrectedStudents() {
            document.getElementById('records-list').innerHTML = '<p>❌ 成功載入未訂正學生名單 (Correction List)。</p>';
        }

        function calculateAbsentStudents() {
            document.getElementById('records-list').innerHTML = '<p>🚫 成功載入缺考學生名單 (Absent List)。</p>';
        }
    </script>
</body>
</html>
