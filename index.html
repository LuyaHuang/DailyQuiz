<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  .quiz-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 600px; }
  .instruction { background: #f0f4f8; padding: 10px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #0056b3; }
  .option-item { margin: 8px 0; display: block; }
  .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  .result-table th, .result-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
</style>
</head>
<body>

<div id="quiz-container" class="quiz-box"></div>

<script>
// 1. 各題型說明文字定義
const DEF = {
  A: "【DEF_A】填充題說明：請在下方文字框填入正確答案。",
  B: "【DEF_B】單選題說明：請閱讀題目後，於四個選項中點選一個最佳答案。",
  C: "【DEF_C】單選題說明：請閱讀題目後，於四個選項中點選一個最佳答案。",
  D: "【DEF_D】是非題說明：請判斷題目敘述，點選 True 或 False。"
};

// 2. 題目資料集
const questions = [
  { id: 1, type: 'A', text: "台灣最高的山峰名稱是？", points: 10, answer: "玉山" },
  { id: 2, type: 'B', text: "下列何者為光合作用的主要產物？", options: ["二氧化碳", "氧氣", "氮氣", "氫氣"], points: 15, answer: "2" },
  { id: 3, type: 'C', text: "水的化學分子式為何？", options: ["H2O", "CO2", "NaCl", "O2"], points: 15, answer: "1" },
  { id: 4, type: 'D', text: "地球繞太陽公轉一圈約為 365 天。", points: 10, answer: "True" }
];

let currentIndex = 0;
let userAnswers = {};
let currentType = null;

// 3. 渲染單一題目
function renderQuestion() {
  const container = document.getElementById('quiz-container');
  
  if (currentIndex >= questions.length) {
    renderResults();
    return;
  }

  const q = questions[currentIndex];
  let html = '';

  // 顯示大題說明 DEF (當題型改變或第一題時呈現)
  if (q.type !== currentType) {
    html += `<div class="instruction">${DEF[q.type]}</div>`;
    currentType = q.type;
  }

  // 顯示題號、題目與配分
  html += `<h3>第 ${currentIndex + 1} 題：${q.text} (${q.points} Points)</h3>`;

  // 根據 Type 分支渲染對應 UI
  switch (q.type) {
    case 'A': // Type A: 填充題 (文字框)
      html += `<input type="text" id="user-input" style="width: 80%; padding: 8px;" placeholder="請在此輸入答案...">`;
      break;

    case 'B': // Type B & C: 選擇題 (4 行選項 + 單選圓圈)
    case 'C':
      q.options.forEach((opt, idx) => {
        html += `
          <label class="option-item">
            <input type="radio" name="quiz-choice" value="${idx + 1}">
            選項 ${idx + 1}：${opt}
          </label>`;
      });
      break;

    case 'D': // Type D: 是非題 (True / False 單選圓圈)
      html += `
        <label class="option-item"><input type="radio" name="quiz-choice" value="True"> True</label>
        <label class="option-item"><input type="radio" name="quiz-choice" value="False"> False</label>`;
      break;
  }

  // 確定按鈕
  html += `<br><button onclick="handleNext()" style="margin-top: 15px; padding: 8px 20px;">確定</button>`;
  container.innerHTML = html;
}

// 4. 暫存答案並前進下一題
function handleNext() {
  const q = questions[currentIndex];
  let ans = '';

  if (q.type === 'A') {
    const inputEl = document.getElementById('user-input');
    ans = inputEl ? inputEl.value.trim() : '';
  } else {
    const selected = document.querySelector('input[name="quiz-choice"]:checked');
    ans = selected ? selected.value : '';
  }

  userAnswers[currentIndex] = ans;
  currentIndex++;
  renderQuestion();
}

// 5. 作答完畢結算頁面
function renderResults() {
  const container = document.getElementById('quiz-container');
  let totalScore = 0;
  let maxScore = 0;

  let tableRows = '';
  questions.forEach((q, idx) => {
    maxScore += q.points;
    const userAns = userAnswers[idx] || '未作答';
    const isCorrect = String(userAns).trim().toLowerCase() === String(q.answer).trim().toLowerCase();
    const score = isCorrect ? q.points : 0;
    totalScore += score;

    tableRows += `
      <tr>
        <td>第 ${idx + 1} 題</td>
        <td>${userAns}</td>
        <td>${q.answer}</td>
        <td>${isCorrect ? '⭕ 正確' : '❌ 錯誤'}</td>
        <td>${score} / ${q.points}</td>
      </tr>`;
  });

  container.innerHTML = `
    <h2>測驗結束</h2>
    <table class="result-table">
      <thead>
        <tr>
          <th>題號</th>
          <th>您的作答</th>
          <th>正確答案</th>
          <th>對錯判斷</th>
          <th>得分</th>
        </tr>
      </thead>
      <tbody>${tableRows}</tbody>
    </table>
    <h3>最終總成績：${totalScore} / ${maxScore} 分</h3>
  `;
}

// 初始啟動
renderQuestion();
</script>
</body>
</html>
